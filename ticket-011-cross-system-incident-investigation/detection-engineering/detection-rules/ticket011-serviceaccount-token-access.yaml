- rule: Ticket011 Reporting ServiceAccount Token Access Attempt
  desc: >
    Detect attempts to open the Kubernetes ServiceAccount
    token path from the Ticket 011 reporting image.
    Includes failed file-open attempts.
  condition: >
    evt.type in (open, openat, openat2) and
    evt.dir = < and
    container.id != host and
    container.image.repository contains "ticket011-reporting-api" and
    evt.arg.name contains "/var/run/secrets/kubernetes.io/serviceaccount/token"
  output: >
    Ticket011 reporting ServiceAccount token access attempt
    image=%container.image.repository
    container=%container.id
    process=%proc.name
    result=%evt.res
  priority: WARNING
  tags: [ticket011, container, credential_access, detection_enhancement]
