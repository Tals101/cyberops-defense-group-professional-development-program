apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting-api
  namespace: ticket-011-lab
  labels:
    app.kubernetes.io/part-of: ticket-011
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-api
  namespace: ticket-011-lab
  labels:
    app.kubernetes.io/part-of: ticket-011
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ticket011-reporting-api
  template:
    metadata:
      labels:
        app: ticket011-reporting-api
        app.kubernetes.io/part-of: ticket-011
    spec:
      serviceAccountName: reporting-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting-api
          image: ticket011-reporting-api:lab-v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-api
  namespace: ticket-011-lab
  labels:
    app.kubernetes.io/part-of: ticket-011
spec:
  type: ClusterIP
  selector:
    app: ticket011-reporting-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP